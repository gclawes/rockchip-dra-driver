---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "rockchip-dra-driver.fullname" . }}-kubeletplugin
  namespace: {{ include "rockchip-dra-driver.namespace" . }}
  labels:
    {{- include "rockchip-dra-driver.labels" . | nindent 4 }}
    app.kubernetes.io/component: kubeletplugin
spec:
  selector:
    matchLabels:
      {{- include "rockchip-dra-driver.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: kubeletplugin
  {{- with .Values.kubeletPlugin.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      {{- with .Values.kubeletPlugin.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "rockchip-dra-driver.templateLabels" . | nindent 8 }}
        app.kubernetes.io/component: kubeletplugin
    spec:
      {{- if .Values.kubeletPlugin.priorityClassName }}
      priorityClassName: {{ .Values.kubeletPlugin.priorityClassName }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "rockchip-dra-driver.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.kubeletPlugin.podSecurityContext | nindent 8 }}
      containers:
      - name: plugin
        securityContext:
          {{- toYaml .Values.kubeletPlugin.containers.plugin.securityContext | nindent 10 }}
        image: {{ include "rockchip-dra-driver.fullimage" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command: ["kubeletplugin"]
        resources:
          {{- toYaml .Values.kubeletPlugin.containers.plugin.resources | nindent 10 }}
        {{- if (gt (int .Values.kubeletPlugin.containers.plugin.metricsPort) 0) }}
        ports:
        - name: metrics
          containerPort: {{ .Values.kubeletPlugin.containers.plugin.metricsPort }}
          protocol: TCP
        {{- end }}
        env:
        - name: DRIVER_NAME
          value: {{ include "rockchip-dra-driver.driverName" . | quote }}
        - name: CDI_ROOT
          value: /var/run/cdi
        - name: KUBELET_REGISTRAR_DIRECTORY_PATH
          value: {{ .Values.kubeletPlugin.kubeletRegistrarDirectoryPath | quote }}
        - name: KUBELET_PLUGINS_DIRECTORY_PATH
          value: {{ .Values.kubeletPlugin.kubeletPluginsDirectoryPath | quote }}
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: MOCK_DEVICES
          value: {{ .Values.mockDevices | quote }}
        - name: NPU_ENABLED
          value: {{ .Values.npu.enabled | quote }}
        - name: GPU_ENABLED
          value: {{ .Values.gpu.enabled | quote }}
        - name: NPU_MAX_ALLOCATIONS
          value: {{ .Values.npu.maxAllocations | quote }}
        - name: GPU_MAX_ALLOCATIONS
          value: {{ .Values.gpu.maxAllocations | quote }}
        {{- if (gt (int .Values.kubeletPlugin.containers.plugin.metricsPort) 0) }}
        - name: METRICS_PORT
          value: {{ .Values.kubeletPlugin.containers.plugin.metricsPort | quote }}
        {{- end }}
        volumeMounts:
        - name: plugins-registry
          mountPath: {{ .Values.kubeletPlugin.kubeletRegistrarDirectoryPath | quote }}
        - name: plugins
          mountPath: {{ .Values.kubeletPlugin.kubeletPluginsDirectoryPath | quote }}
        - name: cdi
          mountPath: /var/run/cdi
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /sys
          readOnly: true
      volumes:
      - name: plugins-registry
        hostPath:
          path: {{ .Values.kubeletPlugin.kubeletRegistrarDirectoryPath | quote }}
      - name: plugins
        hostPath:
          path: {{ .Values.kubeletPlugin.kubeletPluginsDirectoryPath | quote }}
      - name: cdi
        hostPath:
          path: /var/run/cdi
      - name: dev
        hostPath:
          path: /dev
      - name: sys
        hostPath:
          path: /sys
      {{- with .Values.kubeletPlugin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubeletPlugin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.kubeletPlugin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
