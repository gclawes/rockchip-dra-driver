name: Cleanup Pre-Releases

on:
  pull_request:
    types: [closed]
  delete:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch name whose preview tags should be deleted
        required: true

jobs:
  cleanup-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      actions: write
    steps:
      - name: Cleanup GHCR artifacts for closed PR
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: rockchip-dra-driver,rockchip-dra-driver/charts/rockchip-dra-driver
          delete-tags: '.*-pr-${{ github.event.pull_request.number }}$'
          use-regex: true

  cleanup-branch:
    if: (github.event_name == 'delete' && github.event.ref_type == 'branch') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      actions: write
    steps:
      - name: Normalize branch name
        id: normalize
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.branch }}"
          else
            RAW="${{ github.event.ref }}"
          fi
          BRANCH=$(echo "$RAW" | sed 's|[/_]|-|g')
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
      - name: Cleanup GHCR artifacts for deleted branch
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          packages: rockchip-dra-driver,rockchip-dra-driver/charts/rockchip-dra-driver
          delete-tags: '.*-branch-${{ steps.normalize.outputs.branch }}$'
          use-regex: true
