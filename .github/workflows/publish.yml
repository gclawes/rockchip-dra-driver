name: Publish Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build and push (for example 0.1.0)
        required: true

jobs:
  publish:
    if: (github.event_name == 'workflow_dispatch' && inputs.tag != '0.0.0') || (github.event_name == 'release' && github.event.release.tag_name != '0.0.0')
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: publish-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.name }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push artifacts
        env:
          GIT_TAG: ${{ steps.tag.outputs.name }}
          CONTAINER_TOOL: docker
          PLATFORMS: linux/arm64
          DRIVER_IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
          DRIVER_CHART_REGISTRY: ghcr.io/${{ github.repository }}/charts
        run: make push-release-artifacts
      - name: Sign release with cosign
        env:
          GIT_TAG: ${{ steps.tag.outputs.name }}
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:${GIT_TAG}"
          CHART="ghcr.io/${{ github.repository }}/charts/rockchip-dra-driver:${GIT_TAG}"
          IMAGE_DIGEST="$(docker buildx imagetools inspect "$IMAGE" --format '{{json .}}' | jq -r '.manifest.digest // .digest')"
          CHART_DIGEST="$(docker buildx imagetools inspect "$CHART" --format '{{json .}}' | jq -r '.manifest.digest // .digest')"
          cosign sign --yes --recursive "${IMAGE}@${IMAGE_DIGEST}"
          cosign sign --yes --recursive "${CHART}@${CHART_DIGEST}"
