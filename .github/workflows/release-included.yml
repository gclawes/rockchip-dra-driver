name: Update release included list

on:
  pull_request_target:
    types: [closed]
    branches:
      - 'prep/**'

# Runs from the default branch. Do not check out the merged pull request.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: release-included-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  included:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - name: Rewrite Included section
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRAIN_REF: ${{ github.event.pull_request.base.ref }}
        run: bash hack/update-release-included.sh
