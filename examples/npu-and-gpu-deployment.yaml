# One replica that needs both the NPU and the GPU on the same node.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: npu-gpu-example-npu
spec:
  spec:
    devices:
      requests:
      - name: npu
        exactly:
          deviceClassName: npu.rockchip.com
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: npu-gpu-example-gpu
spec:
  spec:
    devices:
      requests:
      - name: gpu
        exactly:
          deviceClassName: gpu.rockchip.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: npu-gpu-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: npu-gpu-example
  template:
    metadata:
      labels:
        app: npu-gpu-example
    spec:
      resourceClaims:
      - name: npu
        resourceClaimTemplateName: npu-gpu-example-npu
      - name: gpu
        resourceClaimTemplateName: npu-gpu-example-gpu
      containers:
      - name: app
        image: debian:bookworm-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "=== DRA env ==="
          env | grep DRA_ROCKCHIP || true
          echo "=== devices ==="
          ls -l /dev/accel /dev/dri 2>/dev/null || true
          sleep infinity
        resources:
          claims:
          - name: npu
          - name: gpu
