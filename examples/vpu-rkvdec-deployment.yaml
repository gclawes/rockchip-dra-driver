# One replica claiming the rkvdec decoder. videoN is not a stable name;
# the container prints the path from DRA_ROCKCHIP_VPU_RKVDEC_DEVICE.
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: vpu-rkvdec-example
spec:
  spec:
    devices:
      requests:
      - name: vpu
        exactly:
          deviceClassName: vpu-rkvdec.rockchip.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vpu-rkvdec-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vpu-rkvdec-example
  template:
    metadata:
      labels:
        app: vpu-rkvdec-example
    spec:
      resourceClaims:
      - name: vpu
        resourceClaimTemplateName: vpu-rkvdec-example
      # Non-root pods must set supplementalGroups to the host deviceGid.
      # On a typical board this node is group video, not render.
      # See examples/README.md. This example runs as root.
      containers:
      - name: app
        image: debian:bookworm-slim
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "=== DRA env ==="
          env | grep DRA_ROCKCHIP || true
          echo "=== device ==="
          node="${DRA_ROCKCHIP_VPU_RKVDEC_DEVICE:-}"
          if [ -n "$node" ]; then
            ls -l "$node" || true
          fi
          sleep infinity
        resources:
          claims:
          - name: vpu
